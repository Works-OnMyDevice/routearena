name = "routearena-api"
main = "src/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["17 3 * * *"]

[durable_objects]
bindings = [{ name = "RELAY", class_name = "RelayState" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayState"]

# Non-secret configuration. Secrets (TOKENROUTER_MASTER_KEY, TOKENROUTER_MANAGEMENT_KEY, HMAC_SECRET, ADMIN_SECRET,
# RESEND_API_KEY, ALERT_EMAIL, MAIL_FROM) are set with `wrangler secret put` and never live in this file.
[vars]
TOKENROUTER_BASE_URL = "https://api.tokenrouter.com"
PUBLIC_BASE_URL = "https://routearena-api.routearena-api.workers.dev"
PER_CLAIM_USD = "1"
GLOBAL_CAP_USD = "300"
CLAIM_DAYS = "7"
CLAIMS_ENABLED = "true"
RELAY_ENABLED = "true"
RELAY_MAX_TOKENS = "2048"
RELAY_RPM = "60"
